name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The label gate and the aislop gate are not here: both are shared workflows
  # vendored from kollektiv into this directory (pr-labelled.yml, aislop.yml),
  # the same copies Konnekt runs, kept identical by kollektiv's
  # sync-workflows.sh --check.

  # The release-notes generator never runs until a release is being cut, which
  # is the worst moment to find out it is wrong. It is pure and offline, so its
  # tests run on every push instead. The script and the tests are vendored from
  # kollektiv; .github/changelog.json is this repo's own input to it.
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python3 .github/scripts/release-notes_test.py

  # This repo's own two release scripts, kept in a separate job from the
  # vendored generator above because only these need `rpm` installed.
  #
  # They decide which tag a release is cut as and whether the snapshot channel
  # has stranded, and neither failure announces itself afterwards: a tag that
  # sorts below an existing one leaves /releases/latest pointing at the older
  # release forever, and a stranded snapshot RPM simply stops upgrading. Both
  # are pure and offline, so they run on every push rather than at the moment
  # someone is cutting a release.
  #
  # `rpm` is installed for one class of case in version-precedence_test.py: it
  # puts every version shape this ladder emits through rpm's own vercmp and
  # checks the answer matches semver's. Without the binary that class reports a
  # skip, and a skip is not a pass, so it is installed rather than tolerated.
  release-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install rpm
        run: sudo apt-get update && sudo apt-get install -y rpm

      - run: python3 .github/scripts/version-precedence_test.py
      - run: python3 .github/scripts/release-tag_test.py

  # The JS toolchain. This used to be the only job "because there is one
  # toolchain"; #44 ended that — the Go shell has its own job below, because it
  # needs system webkit headers this half never touches, and a platform failure
  # there should not block a web check that shares nothing with it (the same
  # argument docs/suite.md makes against a monorepo, one level down).
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pnpm install --frozen-lockfile

      # The deriver caches each pinned mcmeta tag. The tag is immutable, so the cache
      # never goes stale and the key never needs a fallback: a hit means the run below
      # touches no network at all. Without this, an mcmeta outage would fail the
      # generated-file check on a change that has nothing to do with it.
      - uses: actions/cache@v4
        with:
          path: .cache/mcmeta
          key: mcmeta-${{ hashFiles('src/data/versions/*.ts') }}

      # Named steps rather than leaving these to the runner below. Both run the
      # same commands — health.commands and these steps are the same list — but a
      # failing step named `lint` reads better from the checks tab than one row in
      # a runner's table, and the duplication is four lines.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      # The frontend's coverage floor, the way `go run ./scripts/coverage-floor`
      # holds the shell's: vite.config.ts owns the threshold. A second run of
      # the suite rather than folding coverage into `pnpm test`, so a floor
      # failure and a test failure stay separate steps.
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm check-bundle

      # The manifest is the authority on what this repo's health means, and until
      # now nothing ever ran it on a push: the invariant greps and the generated
      # clean-diff check only executed when someone invoked /suite-kit:health with
      # the plugin installed. Declaring a plugin does not install it.
      #
      # --require-runnable turns a skip into a failure. Every declared check can
      # genuinely run here, so a skip means the setup above broke rather than a
      # check that legitimately does not apply — and a skip reported as green is
      # how this repo spent its whole pre-scaffold life looking healthy.
      #
      # ruff is installed because health.commands includes the aislop gate, and
      # aislop's Python engines run only when a ruff binary is on PATH. Without
      # it they report `[ok] 0 issues` rather than saying they did nothing, so
      # this job was scoring no Python here and calling it a pass. The runner now
      # refuses to pretend otherwise, which under --require-runnable is a
      # failure; installing ruff is what makes the comment above true again.
      #
      # The version must match the one in .github/workflows/aislop.yml. The
      # runner reads `ruff==` from this directory to know what to expect, and two
      # different answers make it decline to guess, which would quietly retire
      # the check this pin exists to keep honest.
      - run: pip install ruff==0.16.7

      - name: Health manifest
        run: ./.claude/suite-check.py --require-runnable

  # The Go shell (#44). The frontend is built first because main.go embeds
  # dist/ — the zero-code-change answer to shipping command data offline — so
  # the Go compiler cannot run before Vite has. The cgo-free checks (gofmt,
  # go test over shell/) run before the system headers are installed,
  # deliberately: they are the checks the health manifest declares, and running
  # them in the same order the manifest does keeps CI and /suite-kit:health
  # failing on the same line. Vet and the full compile come after apt, because
  # the main package compiles against webkit2gtk — 4.1 on this runner, hence
  # the webkit2_41 tag, and desktop,production because that is the tag set
  # `wails build` uses for a packaged binary.
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go test ./shell/...
      # Threshold and rationale live in the script, which .claude/suite.json also
      # runs, so /suite-kit:health enforces the same floor locally.
      - run: go run ./scripts/coverage-floor

      - name: System webkit headers
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - run: go vet -tags desktop,production,webkit2_41 ./...
      - name: Compile the desktop shell
        run: go build -tags desktop,production,webkit2_41 -o build/bin/kommands .

      # The release and snapshot workflows stamp the version with
      # `-ldflags "-X main.Version=<tag>"`. The linker's -X writes to a string
      # *variable*: against a `const` it does nothing at all and reports no
      # error, so the shell would ship claiming to be whatever version.go says,
      # in the marker file Konnekt stats and in the capabilities probe. That is
      # not hypothetical, it is what this repo had until #44 closed. Building
      # with a sentinel and reading it back is the only check that catches it,
      # because every other signal is identical either way.
      - name: Assert the version stamp reaches the binary
        run: |
          go build -tags desktop,production,webkit2_41 \
            -ldflags "-X main.Version=ldflags-probe" -o build/bin/kommands-probe .
          STAMPED="$(./build/bin/kommands-probe -version)"
          if [ "$STAMPED" != "ldflags-probe" ]; then
            echo "::error::the binary reports '$STAMPED', not the stamped value. -ldflags -X did not reach main.Version; version.go has to declare it as a var, not a const."
            exit 1
          fi
