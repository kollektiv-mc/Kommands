name: Snapshot

# Rolling build of main, published as the `snapshot` prerelease so people can
# run the newest code without building it themselves.
#
# It stays out of the way of the real releases by being a prerelease:
# /releases/latest ignores prereleases, so the release-notes baseline and the
# resolve job in release.yml never resolve to a snapshot.
#
# Kommands does not update itself, so unlike Konnekt's channel this one is a
# download rather than a subscription. What still has to hold is the *ordering*:
# the snapshot RPM has to outrank the installed release RPM or dnf refuses it,
# and the page has to be telling the truth when it says this build is newer
# than the latest release. version-precedence.py watches exactly that.
on:
  schedule:
    # Nightly. The check job below exits early when main has not moved since
    # the last snapshot, so an idle week costs one short job a day rather than
    # three platform builds.
    - cron: '0 4 * * *'
  workflow_dispatch:

# One snapshot at a time. A manual run during a scheduled one would race it for
# the same tag.
concurrency:
  group: snapshot

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      sha: ${{ steps.decide.outputs.sha }}
      version: ${{ steps.decide.outputs.version }}
      rpm_version: ${{ steps.decide.outputs.rpm_version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          sha="${{ github.sha }}"
          short="${sha:0:7}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

          # version.go carries the base version ("0.1.0-dev"); take its core.
          # The same one-line declaration release.yml reads, and the reason
          # version.go says to keep it on one line in that shape.
          base="$(sed -n 's/^var Version = "\([^"]*\)".*/\1/p' version.go | head -n1)"
          base="${base%%-*}"
          if [ -z "$base" ]; then
            echo "::error::could not read Version out of version.go."
            exit 1
          fi

          # The commit's own date, UTC, fixed width. That timestamp is the only
          # reason two snapshots can be ordered at all: a bare sha is text, and
          # text says nothing about which build is newer. Taken from the commit
          # rather than `date -u` so re-running this workflow on an unchanged
          # main produces the same version instead of announcing a build people
          # already have.
          stamp="$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d%H%M "$sha")"

          # Deliberately not "-dev". That marker means one thing only, a local
          # `wails dev` build; a snapshot is a real checksummed artefact.
          echo "version=${base}-snapshot.${stamp}.${short}" >> "$GITHUB_OUTPUT"

          # RPM versions cannot contain "-"; "~" sorts before the base version,
          # the same idiom release.yml uses for pre-release tags. The timestamp
          # also keeps consecutive snapshot RPMs orderable: two that differed
          # only by sha would be ordered arbitrarily by rpmvercmp, and
          # `dnf upgrade` could refuse a newer build.
          echo "rpm_version=${base}~snapshot.${stamp}.${short}" >> "$GITHUB_OUTPUT"

          # A snapshot is a prerelease of the *next* version, so version.go's
          # base has to keep this build above the newest published release.
          # When it does not, the usual cause being a tag cut without the
          # follow-up bump, the snapshot RPM stops upgrading and this page
          # starts claiming to be newer than it is. Nothing here can fix that,
          # but an unexplained stranded channel is worth one annotation.
          latest="$(gh api "repos/${{ github.repository }}/releases/latest" \
            --jq .tag_name 2>/dev/null || true)"
          VERSION="${base}-snapshot.${stamp}.${short}" LATEST="$latest" \
            python3 "$GITHUB_WORKSPACE/.github/scripts/version-precedence.py"

          # target_commitish is the commit the current snapshot was cut from.
          # Absent (first run, or someone deleted the release) means build.
          prev="$(gh api "repos/${{ github.repository }}/releases/tags/snapshot" \
            --jq .target_commitish 2>/dev/null || true)"

          if [ "$sha" = "$prev" ] && [ "$EVENT" = 'schedule' ]; then
            echo "main is unchanged since the last snapshot ($prev), nothing to build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      # wails skips the installer with only a warning when makensis is absent,
      # so its absence has to fail here. Same check release.yml makes.
      - name: Check makensis is present
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            Write-Output "::error::makensis is not on PATH, and wails would skip the installer with only a warning."
            exit 1
          }

      - name: Build
        shell: pwsh
        env:
          SNAPSHOT_VERSION: ${{ needs.check.outputs.version }}
        run: wails build -platform windows/amd64 -nsis -ldflags "-X main.Version=$env:SNAPSHOT_VERSION"

      - name: Stage release asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          Copy-Item build/bin/kommands-amd64-installer.exe dist-release/kommands-windows-amd64-installer.exe

      - uses: actions/upload-artifact@v7
        with:
          name: kommands-windows-amd64-installer
          path: dist-release/kommands-windows-amd64-installer.exe
          if-no-files-found: error

  build-linux:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # Same toolchain as release.yml's build-linux; webkit2gtk-4.1 pins the
      # glibc 2.35 / libsoup3 floor this binary targets.
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates curl build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build
        env:
          SNAPSHOT_VERSION: ${{ needs.check.outputs.version }}
        run: wails build -tags webkit2_41 -ldflags "-X main.Version=$SNAPSHOT_VERSION"

      # The stamp matters more here than on a release, not less: the tag is the
      # rolling literal `snapshot`, so the version the binary reports is the
      # only way anyone can tell two of these apart.
      - name: Assert the version stamp landed
        env:
          SNAPSHOT_VERSION: ${{ needs.check.outputs.version }}
        run: |
          STAMPED="$(./build/bin/kommands -version)"
          if [ "$STAMPED" != "$SNAPSHOT_VERSION" ]; then
            echo "::error::the binary reports '$STAMPED' but this snapshot is $SNAPSHOT_VERSION. -ldflags -X did not reach main.Version; check that version.go still declares it as a var."
            exit 1
          fi
          echo "::notice::binary reports $STAMPED"

      - name: Stage release asset
        run: |
          mkdir -p dist-release
          cp build/bin/kommands dist-release/kommands-linux-amd64

      - uses: actions/upload-artifact@v7
        with:
          name: kommands-linux-amd64
          path: dist-release/kommands-linux-amd64
          if-no-files-found: error

  package-rpm:
    needs: [check, build-linux]
    runs-on: ubuntu-latest
    container: rockylinux/rockylinux:10
    steps:
      - name: Install packaging dependencies
        run: dnf install -y git rpm-build rpmdevtools

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v8
        with:
          name: kommands-linux-amd64
          path: dist-release

      - name: Build RPM
        env:
          RPM_VERSION: ${{ needs.check.outputs.rpm_version }}
        run: |
          rpmdev-setuptree
          cp dist-release/kommands-linux-amd64 build/appicon-256.png build/linux/kommands.desktop ~/rpmbuild/SOURCES/
          rpmbuild -bb build/linux/kommands.spec --define "_version $RPM_VERSION"

          mkdir -p dist-rpm
          cp ~/rpmbuild/RPMS/x86_64/*.rpm dist-rpm/

      - uses: actions/upload-artifact@v7
        with:
          name: kommands-rpm
          path: dist-rpm/*.rpm
          if-no-files-found: error

  publish:
    needs: [check, build-windows, build-linux, package-rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance. Same reasoning as release.yml's publish job, and it
      # matters more here rather than less: a snapshot is rebuilt and
      # republished under the same `snapshot` tag every night, so "which build
      # is this" has no answer from the tag alone.
      id-token: write
      attestations: write
    steps:
      # Before the artifacts land: actions/checkout cleans the workspace, so
      # running it second would delete them.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v8
        with:
          pattern: kommands-*
          path: dist-release
          merge-multiple: true

      - name: Checksums
        working-directory: dist-release
        run: sha256sum * > checksums.txt

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: 'dist-release/kommands-*'

      # The notes come from the same generator release.yml calls, so a snapshot
      # and the release it is ahead of are described the same way. The script
      # picks its own baseline, the latest published release rather than the
      # previous snapshot: a snapshot describes everything ahead of the newest
      # release, not just what changed since last night.
      - name: Generate release notes
        working-directory: dist-release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          HEAD_REF: ${{ needs.check.outputs.sha }}
        run: |
          # Losing the notes must not cost the build itself. The commit list is
          # the same information without the shaping, and it needs no baseline,
          # which is one of the ways the script can bail. The warning is the
          # point of the annotation: without it a degraded run is
          # indistinguishable from a good one.
          if ! python3 "$GITHUB_WORKSPACE/.github/scripts/release-notes.py" > changes.md \
            || [ ! -s changes.md ]; then
            echo "::warning::release-notes.py failed; the snapshot body falls back to a commit link"
            echo "**Commits**: $SERVER/$REPO/commits/$HEAD_REF" > changes.md
          fi

      # Delete and recreate rather than edit. `snapshot` has to end up pointing
      # at a new commit with a fresh asset set, and editing a release cannot
      # move its tag: only re-creating it does that, replaces every asset and
      # refreshes published_at in one step. --cleanup-tag drops the old tag so
      # the new release cannot inherit the old commit.
      - name: Publish snapshot
        working-directory: dist-release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SNAPSHOT_VERSION: ${{ needs.check.outputs.version }}
          SHA: ${{ needs.check.outputs.sha }}
          LATEST_URL: ${{ github.server_url }}/${{ github.repository }}/releases/latest
        run: |
          cat > notes.md <<EOF
          Automatic build of \`main\`, rebuilt nightly when there are new
          commits. Each one replaces the last.

          Untested, and newer than the [latest release]($LATEST_URL). It can be
          broken. Export anything you care about before running it.

          Kommands does not update itself, so this will not replace itself with
          the next snapshot. The Windows installer and the RPM both upgrade a
          previous snapshot in place; the bare Linux binary does not.

          Version \`$SNAPSHOT_VERSION\`, commit $SHA. Built by GitHub Actions
          from that commit, with a signed build provenance attestation:
          \`gh attestation verify <file> --repo $REPO\`.

          EOF
          cat changes.md >> notes.md

          # The title is the only place the version appears, because the tag is
          # the rolling literal `snapshot` and deliberately not a version. A
          # malformed one would also be the version the RPM carries, where it
          # becomes a package rpmvercmp cannot order against the last one, so
          # check the shape here rather than shipping it.
          if ! printf '%s' "$SNAPSHOT_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-snapshot\.[0-9]{12}\.[0-9a-f]{7}$'; then
            echo "::error::computed version '$SNAPSHOT_VERSION' is not a valid snapshot version"
            exit 1
          fi

          gh release delete snapshot --yes --cleanup-tag --repo "$REPO" || true

          gh release create snapshot kommands-* checksums.txt \
            --repo "$REPO" \
            --target "$SHA" \
            --title "$SNAPSHOT_VERSION" \
            --notes-file notes.md \
            --prerelease
