<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>preset verify</title>
<!-- Load the REAL shared layer, same order as every generator page. -->
<script src="./shared/data.js"></script>
<script src="./shared/util.js"></script>
<script src="./shared/auth.js"></script>
<script src="./shared/tiers.js"></script>
</head>
<body>
<div id="ui"></div>
<pre id="report"></pre>
<script>
'use strict';
const lines = [];
let fails = 0;
function ok(name, cond, detail) {
  if (!cond) fails++;
  lines.push((cond ? 'PASS ' : 'FAIL ') + name + (detail !== undefined ? '  →  ' + detail : ''));
}

function resetUser(tier) {
  _devReset();
  signUp('t', 't@t.te', 'secret6');   // auto sessions in
  setUserTier(tier);
}

// ── A. LOGIC: savePreset / addToHistory caps (real auth.js + tiers.js) ──────────

// L1 free → never saves, never records
resetUser(null);
let r = savePreset('a', '/give x', 'give');
ok('L1 free savePreset refused', !!r.error, JSON.stringify(r));
ok('L1 free presets empty', getPresets().length === 0, getPresets().length);
let h = addToHistory('/give x', 'give');
ok('L1 free addToHistory refused', h === false, h);
ok('L1 free history empty', getHistory().length === 0, getHistory().length);

// L2 copper → cap 1 preset, cap 1 history
resetUser('copper');
let c1 = savePreset('a', '/c1', 'give');
let c2 = savePreset('b', '/c2', 'give');
ok('L2 copper 1st save ok', !!c1.id, JSON.stringify(c1));
ok('L2 copper 2nd save refused', !!c2.error, JSON.stringify(c2));
ok('L2 copper presets == 1', getPresets().length === 1, getPresets().length);
addToHistory('/h1', 'give'); addToHistory('/h2', 'give'); addToHistory('/h3', 'give');
ok('L2 copper history capped to 1', getHistory().length === 1, getHistory().length);
ok('L2 copper history newest-first', getHistory()[0].command === '/h3', getHistory()[0] && getHistory()[0].command);

// L3 minTierFor: top-level (1-arg) + nested (2-arg) both work, no hardcoded strings
ok('L3 minTierFor savedPresets', minTierFor('savedPresets') === 'copper', minTierFor('savedPresets'));
ok('L3 minTierFor commandHistory', minTierFor('commandHistory') === 'copper', minTierFor('commandHistory'));
ok('L3 minTierFor give.rarity (2-arg)', minTierFor('give', 'rarity') === 'gold', minTierFor('give', 'rarity'));
ok('L3 minTierFor summon.equipment (2-arg)', minTierFor('summon', 'equipment') === 'gold', minTierFor('summon', 'equipment'));

// L4 diamond → cap 25 presets, cap 100 history
resetUser('diamond');
for (let i = 0; i < 3; i++) savePreset('p' + i, '/d' + i, 'give');
ok('L4 diamond 3 saves ok', getPresets().length === 3, getPresets().length);
for (let i = 0; i < 5; i++) addToHistory('/dh' + i, 'give');
ok('L4 diamond history == 5 (cap 100)', getHistory().length === 5, getHistory().length);

// L5 netherite → Infinity cap, history ceiling = HISTORY_LIMIT (200)
resetUser('netherite');
ok('L5 netherite savedPresets Infinity', tierFeatures().savedPresets === Infinity, tierFeatures().savedPresets);
ok('L5 netherite commandHistory Infinity', tierFeatures().commandHistory === Infinity, tierFeatures().commandHistory);
ok('L5 HISTORY_LIMIT raised to 200 (> diamond 100)', HISTORY_LIMIT === 200, HISTORY_LIMIT);
for (let i = 0; i < 4; i++) savePreset('n' + i, '/n' + i, 'give');
ok('L5 netherite 4 saves ok', getPresets().length === 4, getPresets().length);

// L6 mid-session downgrade — caps re-read per call
resetUser('netherite');
savePreset('a', '/x', 'give'); savePreset('b', '/y', 'give'); savePreset('c', '/z', 'give');
ok('L6 netherite has 3 presets', getPresets().length === 3, getPresets().length);
setUserTier('copper');                                   // downgrade
let dn = savePreset('d', '/w', 'give');
ok('L6 after downgrade save refused (3>=1)', !!dn.error, JSON.stringify(dn));
ok('L6 presets unchanged at 3', getPresets().length === 3, getPresets().length);

// ── B. UI: real initPresetSaver against real DOM ────────────────────────────────
const MARKUP =
  '<div id="preset-row" class="field-row">' +
  '<input type="text" id="preset-name" maxlength="40">' +
  '<button id="preset-save-btn" class="btn-add">save preset</button>' +
  '<span class="hint" id="preset-status"></span></div>' +
  '<div id="output">/give @s diamond_sword 1</div>';
function mount() { document.getElementById('ui').innerHTML = MARKUP; }
const btn    = () => document.getElementById('preset-save-btn');
const row    = () => document.getElementById('preset-row');
const status = () => document.getElementById('preset-status');

// U1 logged-out → disabled + sign-in link, no tier tag
_devReset(); mount(); initPresetSaver('give');
ok('U1 logged-out btn disabled', btn().disabled === true, btn().disabled);
ok('U1 logged-out shows sign-in link', !!status().querySelector('a') && /sign in/.test(status().textContent), status().textContent);
ok('U1 logged-out no lock-tag', !row().querySelector('.lock-tag'), 'none');

// U2 free logged-in → lockControl "requires copper"
resetUser(null); mount(); initPresetSaver('give');
ok('U2 free row section-locked', row().classList.contains('section-locked'), row().className);
ok('U2 free lock-tag requires copper', (row().querySelector('.lock-tag') || {}).textContent === 'requires copper', (row().querySelector('.lock-tag') || {}).textContent);
ok('U2 free btn disabled', btn().disabled === true, btn().disabled);

// U3 copper empty → enabled, "0/1 saved"
resetUser('copper'); mount(); initPresetSaver('give');
ok('U3 copper btn enabled', btn().disabled === false, btn().disabled);
ok('U3 copper status 0/1 saved', status().textContent === '0/1 saved', status().textContent);
ok('U3 copper no lock-tag', !row().querySelector('.lock-tag'), 'none');

// U4 copper at cap → disabled, "1/1 · upgrade to save more"
resetUser('copper'); savePreset('seed', '/x', 'give'); mount(); initPresetSaver('give');
ok('U4 copper at-cap btn disabled', btn().disabled === true, btn().disabled);
ok('U4 copper at-cap status', status().textContent === '1/1 · upgrade to save more', status().textContent);

// U5 save action wires through to savePreset with #output text
resetUser('gold'); mount(); initPresetSaver('give');
document.getElementById('preset-name').value = 'myp';
btn().click();
ok('U5 save created 1 preset', getPresets().length === 1, getPresets().length);
ok('U5 saved command == #output', getPresets()[0] && getPresets()[0].command === '/give @s diamond_sword 1', getPresets()[0] && getPresets()[0].command);
ok('U5 saved generator == give', getPresets()[0] && getPresets()[0].generator === 'give', getPresets()[0] && getPresets()[0].generator);
ok('U5 status saved ✓', status().textContent === 'saved ✓', status().textContent);

// U6 netherite Infinity → "0 saved" (no n/n)
resetUser('netherite'); mount(); initPresetSaver('give');
ok('U6 netherite status 0 saved', status().textContent === '0 saved', status().textContent);

// U7 summon generatorKey threads through
resetUser('gold'); mount(); initPresetSaver('summon');
document.getElementById('preset-name').value = 'sp';
btn().click();
ok('U7 summon save tagged generator=summon', getPresets()[0] && getPresets()[0].generator === 'summon', getPresets()[0] && getPresets()[0].generator);

// ── Summary ─────────────────────────────────────────────────────────────────────
_devReset();   // leave storage clean
lines.push('');
lines.push(fails === 0 ? ('RESULT: ALL ' + lines.filter(l => l.startsWith('PASS')).length + ' PASS') : ('RESULT: ' + fails + ' FAILURE(S)'));
document.getElementById('report').textContent = lines.join('\n');
</script>
</body>
</html>
