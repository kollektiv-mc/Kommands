<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sign in — mcgen</title>
<link rel="stylesheet" href="./shared/style.css">
<script src="./shared/auth.js"></script>
<script>if (getCurrentUser()) location.replace('./profile.html');</script>
<style>
  /* Override body layout for centered auth screen */
  body {
    min-height: 100vh;
    max-width: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .auth-wrap {
    width: 100%;
    max-width: 380px;
    padding: 40px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ── Brand ── */
  .auth-brand {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--accent);
    text-decoration: none;
    margin-bottom: 8px;
    transition: opacity .15s;
  }

  .auth-brand:hover { opacity: .65; }

  .auth-tagline {
    font-family: var(--mono);
    font-size: 10px;
    color: #2e2e2e;
    letter-spacing: .06em;
    margin-bottom: 40px;
  }

  /* ── Card ── */
  .auth-card {
    width: 100%;
    background: #080808;
    border: 1px solid rgba(255,255,255,.07);
    border-radius: 4px;
    overflow: hidden;
  }

  /* ── Tabs ── */
  .auth-tabs {
    display: flex;
    border-bottom: 1px solid rgba(255,255,255,.07);
  }

  .auth-tab {
    flex: 1;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: #3a3a3a;
    cursor: pointer;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .09em;
    text-transform: uppercase;
    padding: 14px 0 12px;
    margin-bottom: -1px;
    transition: color .15s, border-color .15s;
  }

  .auth-tab:hover  { color: var(--muted); }
  .auth-tab.active { color: var(--text);  border-bottom-color: var(--accent); }

  /* ── Forms ── */
  .auth-form {
    padding: 28px;
    display: none;
  }

  .auth-form.active { display: block; }

  .form-field { margin-bottom: 16px; }

  .form-label {
    display: block;
    font-family: var(--mono);
    font-size: 10px;
    color: #484848;
    letter-spacing: .08em;
    text-transform: uppercase;
    margin-bottom: 7px;
  }

  /* All auth inputs — pure black, no grey */
  .auth-form input {
    background: #000;
    border: 1px solid rgba(255,255,255,.09);
    border-radius: 3px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 300;
    height: 36px;
    padding: 0 12px;
    width: 100%;
    outline: none;
    transition: border-color .15s;
    appearance: none;
    -webkit-appearance: none;
  }

  .auth-form input::placeholder { color: #2a2a2a; }

  .auth-form input:focus { border-color: var(--accent); }

  /* ── Error ── */
  .form-error {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--danger);
    margin-top: 12px;
    min-height: 16px;
  }

  /* ── Submit — filled accent button ── */
  .btn-submit {
    width: 100%;
    background: var(--accent);
    border: none;
    border-radius: 3px;
    color: #000;
    cursor: pointer;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .08em;
    height: 40px;
    margin-top: 20px;
    transition: opacity .15s;
  }

  .btn-submit:hover { opacity: .82; }

  /* ── Footer note ── */
  .auth-note {
    font-family: var(--mono);
    font-size: 10px;
    color: #2e2e2e;
    text-align: center;
    margin-top: 16px;
  }

  .auth-note a {
    color: #4a4a4a;
    text-decoration: none;
    cursor: pointer;
    transition: color .15s;
  }

  .auth-note a:hover { color: var(--muted); }

  /* ── Page footer ── */
  .auth-footer {
    font-family: var(--mono);
    font-size: 10px;
    color: #1e1e1e;
    margin-top: 32px;
    letter-spacing: .06em;
  }
</style>
</head>
<body>

<div class="auth-wrap">

  <a class="auth-brand" href="./index.html">mcgen</a>
  <p class="auth-tagline">minecraft java 1.21.1 · command generators</p>

  <div class="auth-card">
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="showTab(this,'signin')">sign in</button>
      <button class="auth-tab"        onclick="showTab(this,'signup')">sign up</button>
    </div>

    <form class="auth-form active" id="form-signin" onsubmit="doSignIn(event)">
      <div class="form-field">
        <label class="form-label" for="si-email">email</label>
        <input type="email" id="si-email" placeholder="you@example.com"
               autocomplete="email" required>
      </div>
      <div class="form-field">
        <label class="form-label" for="si-pw">password</label>
        <input type="password" id="si-pw" placeholder="••••••••"
               autocomplete="current-password" required>
      </div>
      <div class="form-error" id="si-error"></div>
      <button type="submit" class="btn-submit">sign in</button>
      <p class="auth-note">no account? <a onclick="switchTab('signup')">create one</a></p>
    </form>

    <form class="auth-form" id="form-signup" onsubmit="doSignUp(event)">
      <div class="form-field">
        <label class="form-label" for="su-name">username</label>
        <input type="text" id="su-name" placeholder="Steve"
               autocomplete="username" required>
      </div>
      <div class="form-field">
        <label class="form-label" for="su-email">email</label>
        <input type="email" id="su-email" placeholder="you@example.com"
               autocomplete="email" required>
      </div>
      <div class="form-field">
        <label class="form-label" for="su-pw">password</label>
        <input type="password" id="su-pw" placeholder="min. 6 characters"
               autocomplete="new-password" required>
      </div>
      <div class="form-field">
        <label class="form-label" for="su-pw2">confirm password</label>
        <input type="password" id="su-pw2" placeholder="••••••••"
               autocomplete="new-password" required>
      </div>
      <div class="form-error" id="su-error"></div>
      <button type="submit" class="btn-submit">create account</button>
      <p class="auth-note">already have an account? <a onclick="switchTab('signin')">sign in</a></p>
    </form>
  </div>

  <p class="auth-footer">mc 1.21.1 · java edition</p>

</div>

<script>
function showTab(btn, id) {
  document.querySelectorAll('.auth-tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('form-' + id).classList.add('active');
}

function switchTab(id) {
  showTab(document.querySelectorAll('.auth-tab')[id === 'signin' ? 0 : 1], id);
}

function doSignIn(e) {
  e.preventDefault();
  const result = signIn(
    document.getElementById('si-email').value,
    document.getElementById('si-pw').value
  );
  if (result.error) {
    document.getElementById('si-error').textContent = result.error;
    return;
  }
  location.href = './profile.html';
}

function doSignUp(e) {
  e.preventDefault();
  const pw  = document.getElementById('su-pw').value;
  const pw2 = document.getElementById('su-pw2').value;
  if (pw !== pw2) {
    document.getElementById('su-error').textContent = 'Passwords do not match.';
    return;
  }
  const result = signUp(
    document.getElementById('su-name').value,
    document.getElementById('su-email').value,
    pw
  );
  if (result.error) {
    document.getElementById('su-error').textContent = result.error;
    return;
  }
  location.href = './profile.html';
}

window.addEventListener('pageshow', function() {
  if (getCurrentUser()) location.replace('./profile.html');
});
</script>
</body>
</html>
