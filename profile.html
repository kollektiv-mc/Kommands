<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>profile — mcgen</title>
<link rel="stylesheet" href="./shared/style.css">
<script src="./shared/auth.js"></script>
<script src="./shared/util.js"></script>
<script>requireAuth('./auth.html');</script>
<style>
  /* ── Profile header ── */
  .profile-header {
    display: flex;
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 32px;
  }

  .avatar {
    width: 52px;
    height: 52px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 20px;
    color: var(--muted);
    flex-shrink: 0;
    user-select: none;
  }

  .profile-name {
    font-family: var(--mono);
    font-size: 16px;
    font-weight: 400;
    color: var(--text);
    margin-bottom: 6px;
  }

  .profile-sub {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
  }

  .profile-meta {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }

  /* ── Overview stats ── */
  .stat-row {
    display: flex;
    gap: 36px;
    padding: 4px 0 8px;
  }

  .stat-value {
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 400;
    color: var(--text);
    margin-bottom: 4px;
  }

  .stat-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: .08em;
    text-transform: uppercase;
  }

  /* ── Preset & history rows ── */
  .item-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 0;
    border-top: 1px solid var(--border);
  }

  .item-row:last-child { border-bottom: 1px solid var(--border); }

  .item-name {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text);
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .item-cmd {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .item-tag {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: .06em;
    flex-shrink: 0;
    width: 56px;
  }

  .item-date {
    font-family: var(--mono);
    font-size: 10px;
    color: #333;
    flex-shrink: 0;
    width: 80px;
    text-align: right;
  }

  .btn-row-copy {
    background: none;
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--muted);
    cursor: pointer;
    font-family: var(--mono);
    font-size: 10px;
    height: 24px;
    padding: 0 8px;
    flex-shrink: 0;
    transition: border-color .15s, color .15s;
  }

  .btn-row-copy:hover { border-color: var(--accent); color: var(--accent); }
  .btn-row-copy.ok    { border-color: var(--accent); color: var(--accent); }

  .btn-row-del {
    background: none;
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--muted);
    cursor: pointer;
    font-family: var(--mono);
    font-size: 14px;
    width: 24px;
    height: 24px;
    line-height: 1;
    flex-shrink: 0;
    transition: color .1s, border-color .1s;
  }

  .btn-row-del:hover { color: var(--danger); border-color: #444; }

  /* ── Subscription ── */
  .plan-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 3px;
    margin-bottom: 24px;
  }

  .plan-name {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
    margin-bottom: 4px;
  }

  .plan-status {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .plan-status.active { color: var(--accent); }

  /* ── Carousel strip ── */
  .carousel-strip {
    display: flex;
    gap: 2px;
    margin-bottom: 10px;
  }

  .carousel-tab {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 3px;
    cursor: pointer;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 8px 4px 6px;
    color: #3a3a3a;
    transition: color .15s, border-color .15s, background .15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .carousel-tab .tab-price {
    font-size: 9px;
    font-weight: 300;
    letter-spacing: .03em;
    color: #2e2e2e;
  }

  .carousel-tab.copper.active    { color: var(--copper);    border-color: rgba(200,121,65,.4);  background: rgba(200,121,65,.07);  }
  .carousel-tab.iron.active      { color: var(--iron);      border-color: rgba(168,176,184,.35); background: rgba(168,176,184,.06); }
  .carousel-tab.gold.active      { color: var(--gold);      border-color: rgba(212,169,60,.4);  background: rgba(212,169,60,.08);  }
  .carousel-tab.diamond.active   { color: var(--diamond);   border-color: rgba(78,204,212,.4);  background: rgba(78,204,212,.07);  }
  .carousel-tab.netherite.active { color: var(--netherite); border-color: rgba(153,128,176,.4); background: rgba(153,128,176,.09); }

  .carousel-tab.copper.active    .tab-price { color: rgba(200,121,65,.55);  }
  .carousel-tab.iron.active      .tab-price { color: rgba(168,176,184,.55); }
  .carousel-tab.gold.active      .tab-price { color: rgba(212,169,60,.55);  }
  .carousel-tab.diamond.active   .tab-price { color: rgba(78,204,212,.55);  }
  .carousel-tab.netherite.active .tab-price { color: rgba(153,128,176,.55); }

  /* ── Carousel card ── */
  .carousel-card {
    border-radius: 4px;
    padding: 26px 22px 22px;
  }

  .carousel-card.copper {
    border: 1px solid rgba(200,121,65,.18);
    border-left: 3px solid var(--copper);
    background: rgba(200,121,65,.04);
  }
  .carousel-card.iron {
    border: 1px solid rgba(168,176,184,.16);
    border-left: 3px solid var(--iron);
    background: rgba(168,176,184,.04);
  }
  .carousel-card.gold {
    border: 1px solid rgba(212,169,60,.2);
    border-left: 3px solid var(--gold);
    background: rgba(212,169,60,.06);
    box-shadow: 0 4px 28px rgba(212,169,60,.07);
  }
  .carousel-card.diamond {
    border: 1px solid rgba(78,204,212,.22);
    border-left: 3px solid var(--diamond);
    background: rgba(78,204,212,.06);
    box-shadow: 0 4px 32px rgba(78,204,212,.09);
  }
  .carousel-card.netherite {
    border: 1px solid rgba(153,128,176,.28);
    border-left: 3px solid var(--netherite);
    background: rgba(153,128,176,.09);
    box-shadow: 0 6px 40px rgba(153,128,176,.14);
  }

  .carousel-card.is-entering {
    animation: cardEnter .18s ease-out;
  }

  @keyframes cardEnter {
    from { opacity: 0; transform: translateY(5px); }
    to   { opacity: 1; transform: translateY(0);   }
  }

  /* ── Card header ── */
  .c-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .c-name {
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 400;
    letter-spacing: .07em;
    text-transform: uppercase;
    line-height: 1;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .carousel-card.copper    .c-name { color: var(--copper);    }
  .carousel-card.iron      .c-name { color: var(--iron);      }
  .carousel-card.gold      .c-name { color: var(--gold);      }
  .carousel-card.diamond   .c-name { color: var(--diamond);   }
  .carousel-card.netherite .c-name { color: var(--netherite); }

  .c-tagline {
    font-family: var(--mono);
    font-size: 11px;
    color: #444;
  }

  .c-price {
    font-family: var(--mono);
    font-size: 30px;
    font-weight: 400;
    color: var(--text);
    line-height: 1;
    text-align: right;
    flex-shrink: 0;
  }

  .carousel-card.diamond   .c-price { font-size: 32px; }
  .carousel-card.netherite .c-price { font-size: 34px; }

  .c-period {
    display: block;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    font-weight: 300;
    letter-spacing: .05em;
    text-align: right;
    margin-top: 5px;
  }

  /* ── Card body ── */
  .c-divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 0 0 20px;
    opacity: 0.4;
  }

  .c-categories {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-bottom: 24px;
  }

  .c-cat-label {
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 500;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: #363636;
    margin-bottom: 7px;
  }

  .c-gen-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .c-chip {
    font-family: var(--mono);
    font-size: 10px;
    padding: 3px 9px;
    border-radius: 2px;
    border: 1px solid;
    letter-spacing: .03em;
  }

  .carousel-card.copper    .c-chip { color: rgba(200,121,65,.75);  border-color: rgba(200,121,65,.2);  background: rgba(200,121,65,.05);  }
  .carousel-card.iron      .c-chip { color: rgba(168,176,184,.75); border-color: rgba(168,176,184,.2); background: rgba(168,176,184,.04); }
  .carousel-card.gold      .c-chip { color: rgba(212,169,60,.75);  border-color: rgba(212,169,60,.2);  background: rgba(212,169,60,.05);  }
  .carousel-card.diamond   .c-chip { color: rgba(78,204,212,.75);  border-color: rgba(78,204,212,.2);  background: rgba(78,204,212,.05);  }
  .carousel-card.netherite .c-chip { color: rgba(153,128,176,.8);  border-color: rgba(153,128,176,.25); background: rgba(153,128,176,.06); }

  .c-items {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .c-items li {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    display: flex;
    gap: 8px;
  }

  .c-mark { flex-shrink: 0; }

  .carousel-card.copper    .c-mark { color: var(--copper);    }
  .carousel-card.iron      .c-mark { color: var(--iron);      }
  .carousel-card.gold      .c-mark { color: var(--gold);      }
  .carousel-card.diamond   .c-mark { color: var(--diamond);   }
  .carousel-card.netherite .c-mark { color: var(--netherite); }

  /* ── Card footer ── */
  .c-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 18px;
    border-top: 1px solid var(--border);
    opacity: 0.8;
  }

  .c-nav {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .c-arrow {
    background: none;
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--muted);
    cursor: pointer;
    font-family: var(--mono);
    font-size: 13px;
    width: 28px;
    height: 28px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color .15s, border-color .15s;
  }

  .c-arrow:hover:not(:disabled) { color: var(--text); border-color: var(--border-focus); }
  .c-arrow:disabled { opacity: 0.2; cursor: default; }

  .c-dots {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .c-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--border);
    border: none;
    cursor: pointer;
    padding: 0;
    transition: background .2s, transform .2s;
  }

  .c-dot.copper.active    { background: var(--copper);    transform: scale(1.4); }
  .c-dot.iron.active      { background: var(--iron);      transform: scale(1.4); }
  .c-dot.gold.active      { background: var(--gold);      transform: scale(1.4); }
  .c-dot.diamond.active   { background: var(--diamond);   transform: scale(1.4); }
  .c-dot.netherite.active { background: var(--netherite); transform: scale(1.4); }

  .btn-tier {
    background: none;
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--muted);
    cursor: pointer;
    font-family: var(--mono);
    font-size: 11px;
    height: 30px;
    padding: 0 16px;
    white-space: nowrap;
    flex-shrink: 0;
    align-self: flex-start;
    transition: border-color .15s, color .15s;
  }

  .btn-tier.is-active {
    color: var(--accent);
    border-color: rgba(168,255,120,.3);
    cursor: default;
  }

  .btn-tier.is-set:hover { border-color: var(--border-focus); color: var(--text); }

  .btn-cancel-tier {
    background: none;
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--muted);
    cursor: pointer;
    font-family: var(--mono);
    font-size: 11px;
    height: 28px;
    padding: 0 14px;
    transition: border-color .15s, color .15s;
  }

  .btn-cancel-tier:hover { border-color: var(--danger); color: var(--danger); }

  /* ── Sign out ── */
  .nav-link.danger:hover { color: var(--danger); }
</style>
</head>
<body>

<div class="navbar">
  <a class="nav-brand" href="./index.html">mcgen</a>
  <div class="nav-links">
    <a class="nav-link" href="./index.html">generators</a>
    <a class="nav-link active" href="./profile.html">profile</a>
    <a class="nav-link danger" href="#" onclick="doSignOut(event)">sign out</a>
  </div>
</div>

<div class="profile-header">
  <div class="avatar" id="avatar"></div>
  <div>
    <div class="profile-name" id="prof-name"></div>
    <div class="profile-sub">
      <span class="tier-badge" id="prof-badge"></span>
    </div>
    <div class="profile-meta" id="prof-meta"></div>
  </div>
</div>

<div class="tab-bar">
  <button class="tab-btn active" onclick="showTab(this,'overview')">overview</button>
  <button class="tab-btn"        onclick="showTab(this,'presets')">presets</button>
  <button class="tab-btn"        onclick="showTab(this,'history')">history</button>
  <button class="tab-btn"        onclick="showTab(this,'subscription')">subscription</button>
</div>

<!-- overview -->
<div class="tab-panel active" id="panel-overview">
  <div class="block">
    <div class="block-label">stats</div>
    <div class="stat-row" id="stats-row"></div>
  </div>
</div>

<!-- presets -->
<div class="tab-panel" id="panel-presets">
  <div class="block">
    <div class="block-label">saved presets</div>
    <div id="presets-list"></div>
  </div>
</div>

<!-- history -->
<div class="tab-panel" id="panel-history">
  <div class="block">
    <div class="block-label">recent commands</div>
    <div id="history-list"></div>
  </div>
</div>

<!-- subscription -->
<div class="tab-panel" id="panel-subscription">
  <div class="block">
    <div class="block-label">current plan</div>
    <div class="plan-banner">
      <div>
        <div class="plan-name" id="plan-name"></div>
        <div class="plan-status" id="plan-status"></div>
      </div>
      <button class="btn-cancel-tier" id="btn-cancel-tier"
              style="display:none" onclick="cancelTier()">cancel plan</button>
    </div>
  </div>
  <div class="block">
    <div class="block-label">plans</div>
    <div class="tier-list" id="tier-list"></div>
  </div>
</div>

<div class="footer">
  <span>mcgen · mc 1.21.1</span>
  <span><a href="https://minecraft.wiki" target="_blank" rel="noopener">minecraft.wiki</a></span>
</div>

<script>
let carouselIdx = 2; // default to gold

const TIERS = [
  {
    id: 'copper',
    price: '€15',
    tagline: 'Get started',
    categories: [

      { label: 'storage',    items: ['1 saved preset', '1 history entry'] },
    ],
  },
  {

    price: '€45',
    tagline: 'Regular builders',
    categories: [
      { label: 'generators', chips: ['Give', 'Summon', 'Enchant', 'Effect', 'Title'] },

      { label: 'summon',     items: ['Custom name', 'Behavior flags (NoAI, NoGravity, Silent…)'] },

    ],
  },

      { label: 'give item',  items: ['4 lore lines', 'Item rarity', '1 attribute modifier', 'Enchant glint override'] },
      { label: 'summon',     items: ['Health and attributes', 'Equipment (hand and armor)'] },
      { label: 'effect',     items: ['Full control — duration, amplifier, particles'] },
      { label: 'title',      items: ['All modes — title, subtitle, times, clear, reset'] },
      { label: 'storage',    items: ['5 saved presets', '20 history entries'] },
    ],
  },
  {
    id: 'diamond',

    tagline: 'Power users',
    categories: [
      { label: 'generators', chips: ['Give', 'Summon', 'Enchant', 'Effect', 'Title', 'Particle', 'Scoreboard', 'Tellraw'] },
      { label: 'give item',  items: ['10 lore lines', '4 attribute modifiers', 'Food component', 'Potion contents', 'Can-break and can-place-on predicates', 'Hide tooltip flags'] },
      { label: 'summon',     items: ['Active potion effects', 'Scoreboard tags'] },
      { label: 'export',     items: ['Batch export', '.mcfunction files'] },

  {
    id: 'netherite',

    tagline: 'No limits',
    categories: [
      { label: 'generators', chips: ['Give', 'Summon', 'Enchant', 'Effect', 'Title', 'Particle', 'Scoreboard', 'Tellraw'] },
      { label: 'give item',  items: ['Unlimited lore lines', 'Unlimited attribute modifiers', 'Beyond-vanilla enchant levels', 'Fireworks component', 'Custom model data', 'Raw custom data (SNBT)', 'Modded item IDs'] },
      { label: 'summon',     items: ['Passengers', 'Mob-specific NBT data'] },
      { label: 'tellraw',    items: ['Click events (run command, open URL, copy…)', 'Hover events (show text, item, entity)', 'Advanced types (translate, score, selector, keybind)'] },
      { label: 'export',     items: ['Batch', '.mcfunction', 'Datapack'] },
      { label: 'storage',    items: ['Unlimited presets', 'Unlimited history'] },
      { label: 'access',     items: ['API access'] },
    ],
  },
];

function relTime(iso) {
  const s = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (s <    60) return 'just now';
  if (s <  3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
}

function showTab(btn, id) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('panel-' + id).classList.add('active');
}

function doSignOut(e) {
  e.preventDefault();
  logout();
  location.href = './auth.html';
}

// ── Identity ─────────────────────────────────────────────────────────────────
function renderIdentity() {
  const user = getCurrentUser();
  if (!user) return;
  const tier = getUserTier();

  document.getElementById('avatar').textContent = user.username.charAt(0).toUpperCase();
  document.getElementById('prof-name').textContent = user.username;
  document.getElementById('prof-meta').textContent =
    user.email + ' · joined ' + user.joinedAt;

  const badge = document.getElementById('prof-badge');
  badge.textContent = tier || 'free';
  badge.className = 'tier-badge ' + (tier || 'free');
}

// ── Overview ─────────────────────────────────────────────────────────────────
function renderOverview() {
  const user = getCurrentUser();
  if (!user) return;
  const presets = user.presets || [];
  const history = user.history || [];
  const cols    = user.collections || [];

  const stats = [
    { value: presets.length, label: 'presets' },
    { value: history.length, label: 'commands built' },
    { value: cols.length,    label: 'collections' },
  ];

  const row = document.getElementById('stats-row');
  row.textContent = '';
  stats.forEach(s => {
    const wrap  = document.createElement('div');
    const val   = document.createElement('div');
    val.className = 'stat-value';
    val.textContent = s.value;
    const lbl   = document.createElement('div');
    lbl.className = 'stat-label';
    lbl.textContent = s.label;
    wrap.appendChild(val);
    wrap.appendChild(lbl);
    row.appendChild(wrap);
  });
}

// ── Presets ───────────────────────────────────────────────────────────────────
function renderPresets() {
  const list    = document.getElementById('presets-list');
  const presets = getPresets();
  list.textContent = '';

  if (!presets.length) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = 'no presets saved yet\nbuild a command and save it for quick access';
    list.appendChild(empty);
    return;
  }

  presets.forEach(p => {
    const row = document.createElement('div');
    row.className = 'item-row';

    const name = document.createElement('span');
    name.className = 'item-name';
    name.textContent = p.name;

    const cmd = document.createElement('span');
    cmd.className = 'item-cmd';
    cmd.textContent = p.command;

    const tag = document.createElement('span');
    tag.className = 'item-tag';
    tag.textContent = '/' + p.generator;

    const date = document.createElement('span');
    date.className = 'item-date';
    date.textContent = p.savedAt;

    const copyBtn = document.createElement('button');
    copyBtn.className = 'btn-row-copy';
    copyBtn.textContent = 'copy';
    copyBtn.addEventListener('click', () => copyToClipboard(p.command, copyBtn));

    const delBtn = document.createElement('button');
    delBtn.className = 'btn-row-del';
    delBtn.textContent = '×';
    delBtn.addEventListener('click', () => {
      deletePreset(p.id);
      renderPresets();
      renderOverview();
    });

    row.appendChild(name);
    row.appendChild(cmd);
    row.appendChild(tag);
    row.appendChild(date);
    row.appendChild(copyBtn);
    row.appendChild(delBtn);
    list.appendChild(row);
  });
}

// ── History ───────────────────────────────────────────────────────────────────
function renderHistory() {
  const list    = document.getElementById('history-list');
  const history = getHistory();
  list.textContent = '';

  if (!history.length) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = 'no commands built yet\nuse a generator and copy a command to log it here';
    list.appendChild(empty);
    return;
  }

  history.forEach(h => {
    const row = document.createElement('div');
    row.className = 'item-row';

    const cmd = document.createElement('span');
    cmd.className = 'item-cmd';
    cmd.textContent = h.command;

    const tag = document.createElement('span');
    tag.className = 'item-tag';
    tag.textContent = '/' + h.generator;

    const time = document.createElement('span');
    time.className = 'item-date';
    time.textContent = relTime(h.builtAt);

    const copyBtn = document.createElement('button');
    copyBtn.className = 'btn-row-copy';
    copyBtn.textContent = 'copy';
    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(h.command).then(() => {
        copyBtn.textContent = 'copied';
        copyBtn.classList.add('ok');
        setTimeout(() => { copyBtn.textContent = 'copy'; copyBtn.classList.remove('ok'); }, 1800);
      });
    });

    row.appendChild(cmd);
    row.appendChild(tag);
    row.appendChild(time);
    row.appendChild(copyBtn);
    list.appendChild(row);
  });
}

// ── Subscription ──────────────────────────────────────────────────────────────
function renderSubscription() {
  const tier     = getUserTier();
  const nameEl   = document.getElementById('plan-name');
  const statusEl = document.getElementById('plan-status');
  const cancelEl = document.getElementById('btn-cancel-tier');

  nameEl.textContent   = tier ? tier : 'free plan';
  statusEl.textContent = tier ? 'active' : 'no paid plan';
  statusEl.className   = 'plan-status' + (tier ? ' active' : '');
  cancelEl.style.display = tier ? '' : 'none';

  const activeIdx = TIERS.findIndex(t => t.id === tier);
  if (activeIdx >= 0) carouselIdx = activeIdx;

  buildCarousel();
}

function buildCarousel() {
  const tier = getUserTier();
  const list = document.getElementById('tier-list');
  list.textContent = '';

  // Strip
  const strip = document.createElement('div');
  strip.className = 'carousel-strip';
  TIERS.forEach((t, i) => {
    const tab = document.createElement('button');
    tab.className = 'carousel-tab ' + t.id + (i === carouselIdx ? ' active' : '');
    tab.appendChild(document.createTextNode(t.id));
    const price = document.createElement('span');
    price.className = 'tab-price';
    price.textContent = t.price + '/mo';
    tab.appendChild(price);
    tab.addEventListener('click', () => switchCarousel(i));
    strip.appendChild(tab);
  });
  list.appendChild(strip);

  // Card
  const t = TIERS[carouselIdx];
  const isCurrent = t.id === tier;

  const card = document.createElement('div');
  card.className = 'carousel-card ' + t.id + ' is-entering';
  setTimeout(() => card.classList.remove('is-entering'), 200);

  // Header
  const header = document.createElement('div');
  header.className = 'c-header';

  const hLeft = document.createElement('div');

  const cName = document.createElement('div');
  cName.className = 'c-name';
  cName.appendChild(document.createTextNode(t.id));
  if (isCurrent) {
    const badge = document.createElement('span');
    badge.className = 'tier-badge ' + t.id;
    badge.textContent = 'active';
    cName.appendChild(badge);
  }

  const cTagline = document.createElement('div');
  cTagline.className = 'c-tagline';
  cTagline.textContent = t.tagline;

  hLeft.appendChild(cName);
  hLeft.appendChild(cTagline);

  const cPrice = document.createElement('div');
  cPrice.className = 'c-price';
  cPrice.appendChild(document.createTextNode(t.price));
  const cPeriod = document.createElement('span');
  cPeriod.className = 'c-period';
  cPeriod.textContent = 'per month';
  cPrice.appendChild(cPeriod);

  header.appendChild(hLeft);
  header.appendChild(cPrice);
  card.appendChild(header);

  const divider = document.createElement('hr');
  divider.className = 'c-divider';
  card.appendChild(divider);

  // Categories
  const cats = document.createElement('div');
  cats.className = 'c-categories';

  t.categories.forEach(cat => {
    const section = document.createElement('div');

    const label = document.createElement('div');
    label.className = 'c-cat-label';
    label.textContent = cat.label;
    section.appendChild(label);

    if (cat.chips) {
      const chips = document.createElement('div');
      chips.className = 'c-gen-chips';
      cat.chips.forEach(name => {
        const chip = document.createElement('span');
        chip.className = 'c-chip';
        chip.textContent = name;
        chips.appendChild(chip);
      });
      section.appendChild(chips);
    } else {
      const ul = document.createElement('ul');
      ul.className = 'c-items';
      cat.items.forEach(text => {
        const li   = document.createElement('li');
        const mark = document.createElement('span');
        mark.className = 'c-mark';
        mark.textContent = '+';
        li.appendChild(mark);
        li.appendChild(document.createTextNode(text));
        ul.appendChild(li);
      });
      section.appendChild(ul);
    }

    cats.appendChild(section);
  });

  card.appendChild(cats);

  // Footer
  const footer = document.createElement('div');
  footer.className = 'c-footer';

  const nav = document.createElement('div');
  nav.className = 'c-nav';

  const prevBtn = document.createElement('button');
  prevBtn.className = 'c-arrow';
  prevBtn.textContent = '←';
  prevBtn.disabled = carouselIdx === 0;
  prevBtn.addEventListener('click', () => switchCarousel(carouselIdx - 1));

  const dots = document.createElement('div');
  dots.className = 'c-dots';
  TIERS.forEach((td, i) => {
    const dot = document.createElement('button');
    dot.className = 'c-dot ' + td.id + (i === carouselIdx ? ' active' : '');
    dot.addEventListener('click', () => switchCarousel(i));
    dots.appendChild(dot);
  });

  const nextBtn = document.createElement('button');
  nextBtn.className = 'c-arrow';
  nextBtn.textContent = '→';
  nextBtn.disabled = carouselIdx === TIERS.length - 1;
  nextBtn.addEventListener('click', () => switchCarousel(carouselIdx + 1));

  nav.appendChild(prevBtn);
  nav.appendChild(dots);
  nav.appendChild(nextBtn);

  const actionBtn = document.createElement('button');
  if (isCurrent) {
    actionBtn.className = 'btn-tier is-active';
    actionBtn.textContent = 'active plan';
    actionBtn.disabled = true;
  } else {
    actionBtn.className = 'btn-tier is-set';
    actionBtn.textContent = 'set plan';
    actionBtn.addEventListener('click', () => {
      setUserTier(t.id);
      renderIdentity();
      renderSubscription();
    });
  }

  footer.appendChild(nav);
  footer.appendChild(actionBtn);
  card.appendChild(footer);

  list.appendChild(card);
}

function switchCarousel(idx) {
  if (idx < 0 || idx >= TIERS.length) return;
  carouselIdx = idx;
  buildCarousel();
}

function cancelTier() {
  setUserTier(null);
  carouselIdx = 0;
  renderIdentity();
  renderSubscription();
}

// ── Init ──────────────────────────────────────────────────────────────────────
renderIdentity();
renderOverview();
renderPresets();
renderHistory();
renderSubscription();

// On back/forward cache restore, re-check auth in case user signed out elsewhere.
window.addEventListener('pageshow', function(e) {
  if (e.persisted && !getCurrentUser()) location.replace('./auth.html');
});
</script>
</body>
</html>
